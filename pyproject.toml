[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PrismEval"
version = "0.1.0"
description = "LLM evaluation pipeline: batch generation, multi-dimensional scoring, and Streamlit UI. North Star metric–driven evals for PMs and prompt engineers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PrismEval Contributors" }
]
keywords = ["llm", "evaluation", "evals", "prompt-engineering", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "PyYAML>=6.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/Nyota-tree/PrismEval"
Documentation = "https://github.com/Nyota-tree/PrismEval#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
